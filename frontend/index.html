<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nevabase · 数据之间的逻辑</title>
<meta name="description" content="nevabase 把期货品种的价格、利润、基差、汇率和天气数据放在一起，逐条检验它们之间的逻辑关系，再用来复盘、回测和虚拟交易。">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/market.css">
<link rel="privacy-policy" href="/privacy">
<link rel="terms-of-service" href="/terms">
</head>
<body>
<nav class="nav" id="nav"></nav>
<main id="home"></main>
<footer id="footer"></footer>
<script src="/static/js/app.js"></script>
<script src="/static/js/charts.js"></script>
<script>
(function () {
  const { t, esc, num } = Neva;
  const move = (v, d = 2) => `<span class="${Neva.dir(v)}">${Neva.pct(v, d)}</span>`;
  document.title = t("nevabase · 数据之间的逻辑", "nevabase · the logic between market data");
  document.getElementById("home").innerHTML = `
  <section class="wrap" style="padding:72px 24px 40px">
    <span class="label heat">${t("期货 · 之后是 A 股和美股", "Futures · A-shares and US stocks next")}</span>
    <h1 style="max-width:900px;margin-top:14px">${t("把数据之间的<span>逻辑</span>，变成复盘、回测和模拟盘", "Turn the <span>logic</span> between market data into reviews, backtests and paper trading")}</h1>
    <p class="lead" style="max-width:760px">${t("每个品种一个市场：价格、利润、基差、汇率、天气放在一起。“焦煤涨推高焦炭”“雷亚尔贬值压咖啡”这类逻辑，每条都先在历史上检验，再拿来解释行情、做回测、跑模拟盘。",
      "One market per commodity, with prices, margins, basis, FX and weather side by side. Claims like \"dearer coking coal lifts coke\" or \"a weaker real weighs on coffee\" are each tested on history before they explain a move, drive a backtest or trade a paper account.")}</p>
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap"><a class="btn primary lg" href="/coal">${t("看煤炭", "Open Coal")}</a><a class="btn lg" href="/coffee">${t("看咖啡", "Open Coffee")}</a></div>
  </section>
  <section class="wrap" id="markets" style="padding-bottom:56px">
    <div class="sec-head" style="margin-bottom:16px"><div><span class="label">${t("市场", "Markets")}</span><h2>${t("已上线的品种", "Live markets")}</h2></div></div>
    <div class="hub-markets" id="hubMarkets"><div class="card dim">${t("加载中…", "Loading…")}</div></div>
  </section>
  <section class="wrap" id="how" style="padding-bottom:64px">
    <div class="sec-head" style="margin-bottom:16px"><div><span class="label">${t("怎么做的", "How it works")}</span><h2>${t("大模型提假设，数据来裁决", "The model proposes, the data decides")}</h2>
      <p class="muted">${t("每个市场分两期：离线期大模型写候选逻辑、写复盘摘要，可以人审；在线期每个数字都由代码从数据算出来，不调模型。", "Each market runs in two phases: offline, a language model drafts candidate relations and review summaries that can be audited; online, code computes every number from the data and no model is called.")}</p></div></div>
    <div class="how-steps">
      <div class="card"><span class="n">01</span><h3>${t("数据", "Data")}</h3><p class="muted small">${t("期货逐个合约拉取、按持仓量接成主力，收益只在同一合约内算；现货基差、汇率、产区天气按“当天已知”对齐，不偷看未来。", "Futures are pulled contract by contract and chained by open interest, so returns never include a roll; spot basis, FX and weather are aligned to what was known that day.")}</p></div>
      <div class="card"><span class="n">02</span><h3>${t("关系", "Relations")}</h3><p class="muted small">${t("每条逻辑写成可检验的形式：谁驱动谁、怎么度量、滞后几天、看之后几天、同向还是反向、只在哪些月份成立。", "Each claim is written so it can be tested: driver, target, measure, lag, horizon, direction and the months it applies.")}</p></div>
      <div class="card"><span class="n">03</span><h3>${t("检验", "Tests")}</h3><p class="muted small">${t("分两种：同步（一起动，能解释行情）和领先（提前反映，能交易）。最近两年留作样本外；新逻辑包样本外变差就不发布。", "Two kinds: same-period (explains moves) and leading (tradable). The last two years are held out; a new logic pack that does worse out of sample is not published.")}</p></div>
      <div class="card"><span class="n">04</span><h3>${t("复盘 · 回测 · 模拟盘", "Review · backtest · paper")}</h3><p class="muted small">${t("每天收盘后对照逻辑链复盘；任意组合关系做回测；模拟盘可以自己下单，也可以交给逻辑包每天调仓。", "Review every close against the chain; backtest any mix of relations; trade a paper account yourself or let the logic pack rebalance it daily.")}</p></div>
    </div>
  </section>
  <section class="wrap" id="about" style="padding-bottom:72px">
    <div class="card"><span class="label">${t("关于 nevabase", "About nevabase")}</span>
      <p style="margin-top:10px;max-width:820px">${t("nevabase 是一个市场数据分析网站。登录（Google、GitHub 或邮箱）只用于创建和保存你的模拟盘账户；我们只拿到你的名字、邮箱和头像，不访问你的其他 Google 数据。网站展示的是历史数据和统计检验，不构成投资建议。详见<a href=\"/privacy\">隐私政策</a>和<a href=\"/terms\">服务条款</a>。",
        "nevabase is a market-data analysis site. Sign-in (Google, GitHub or email) is used only to create and keep your paper-trading accounts; we receive your name, email and profile picture and nothing else from your Google account. Everything shown is historical data and statistical testing, not investment advice. See the <a href=\"/privacy\">Privacy Policy</a> and <a href=\"/terms\">Terms of Service</a>.")}</p></div>
  </section>`;

  Neva.get("/api/markets").then(({ markets }) => {
    const cards = markets.map(m => {
      if (!m.ready) return `<a class="card hub-card" href="/${esc(m.key)}"><span class="label">${esc(m.group || "")}</span><h3>${esc(t(m.name, m.nameEn))}</h3><p class="dim">${m.online ? t("第一次同步进行中", "First sync in progress") : t("暂时离线", "Offline right now")}</p></a>`;
      return `<a class="card hub-card" href="/${esc(m.key)}">
        <span class="label">${esc(m.group || "")} · ${t("数据截至", "through")} ${esc(m.lastDate)}</span>
        <h3>${esc(t(m.name, m.nameEn))}</h3><p class="muted small">${esc(t(m.tagline, m.taglineEn))}</p>
        <div class="rows">${m.instruments.map(i => `<div class="r"><span>${esc(t(i.name, i.nameEn))}</span><span class="mono">${num(i.close, i.close >= 1000 ? 0 : 2)}</span>${move(i.d1)}${Charts.spark(i.spark, "var(--series-1)", 70, 22)}</div>`).join("")}</div>
        <div class="stats"><span>${t("关系", "Relations")} <b>${m.relations.total}</b></span><span>${t("能解释", "Explain")} <b>${m.relations.comove}</b></span><span>${t("进逻辑包", "In pack")} <b>${m.relations.used}</b></span></div></a>`;
    });
    cards.push(`<div class="card hub-card soon"><span class="label">${t("即将上线", "Coming next")}</span><h3>${t("A 股 · 美股", "A-shares · US stocks")}</h3><p class="small">${t("同一套框架：个股和行业指数作为品种，财务、行业和宏观数据作为驱动。", "Same framework: stocks and sector indices as instruments, financial, sector and macro data as drivers.")}</p></div>`);
    document.getElementById("hubMarkets").innerHTML = cards.join("");
  }).catch(e => { document.getElementById("hubMarkets").innerHTML = `<div class="card">${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
